[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-impose"
version = "0.1.0"
description = "PDF Duplex Grid Imposer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=3.0.0",
    "reportlab>=4.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pikepdf>=8.0.0"
]

[project.scripts]
duplex-impose = "duplex_impose.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.flake8]
max-line-length = 100
extend-ignore = "E203, W503"
